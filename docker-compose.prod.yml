# docker-compose.prod.yml — overrides de produção
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ─── Banco de dados ──────────────────────────────────────────────────────────
  postgres:
    restart: always
    ports: []                          # não expõe porta na VPS
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/postgres/postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  # ─── Backend NestJS ───────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:${IMAGE_TAG:-latest}
    build: null                        # usa imagem do registry em prod
    restart: always
    volumes: []                        # sem volume de código em prod
    environment:
      NODE_ENV: production
      PORT: 3001
    ports: []                          # exposto apenas via Nginx

  # ─── Frontend Next.js ────────────────────────────────────────────────────────
  web:
    image: ghcr.io/${GITHUB_REPOSITORY}/web:${IMAGE_TAG:-latest}
    build: null
    restart: always
    volumes: []
    environment:
      NODE_ENV: production
      PORT: 3000
    ports: []                          # exposto apenas via Nginx

  # ─── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: condominio_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - condominio_net
    depends_on:
      - web
      - backend

  # ─── Certbot (renovação automática de SSL) ────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: condominio_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  postgres_data:
  certbot_www:
  certbot_certs:

networks:
  condominio_net:
    driver: bridge
